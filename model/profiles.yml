Dex:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('GCP_DATASET_ID') }}"
      threads: 4
      location: US

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('PROD_GCP_PROJECT_ID', env_var('GCP_PROJECT_ID')) }}"
      dataset: "{{ env_var('PROD_GCP_DATASET_ID', env_var('GCP_DATASET_ID')) }}"
      threads: 4
      location: US
